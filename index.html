<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Web Editor - Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
    }
    .CodeMirror {
      height: 100% !important;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1f2937;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 3px;
    }
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col font-sans">

  <div id="auth-overlay" class="fixed inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-300">
    
    <div id="auth-loading" class="flex flex-col items-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
      <p id="auth-message" class="text-gray-300 font-bold tracking-wider">認証状態を確認しています...</p>
    </div>
    
    <div id="auth-form-container" class="hidden bg-gray-800 p-8 rounded-xl shadow-2xl w-96 max-w-[90%] border border-gray-700">
      <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Live Web Editor</h2>
      <div id="auth-error" class="hidden bg-red-500/20 text-red-400 p-3 rounded mb-4 text-sm text-center border border-red-500/50"></div>
      
      <div class="mb-4">
        <label class="block text-gray-400 text-sm font-bold mb-2" for="email">メールアドレス</label>
        <input class="shadow appearance-none border border-gray-600 rounded w-full py-2 px-3 bg-gray-700 text-white leading-tight focus:outline-none focus:border-blue-500 transition" id="email" type="email" placeholder="email@example.com">
      </div>
      <div class="mb-6">
        <label class="block text-gray-400 text-sm font-bold mb-2" for="password">パスワード</label>
        <input class="shadow appearance-none border border-gray-600 rounded w-full py-2 px-3 bg-gray-700 text-white leading-tight focus:outline-none focus:border-blue-500 transition" id="password" type="password" placeholder="********">
      </div>
      
      <div class="flex flex-col gap-3">
        <button onclick="handleLogin()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition w-full shadow-lg shadow-blue-900/50">
          ログイン
        </button>
        <div class="text-center text-gray-500 text-xs my-1">または</div>
        <button onclick="handleSignUp()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition w-full border border-gray-600">
          新規アカウント登録
        </button>
      </div>
    </div>
  </div>

  <header id="header" class="bg-gray-900 border-b border-gray-800 px-4 py-2 flex justify-between items-center shadow-md z-20 transition-all duration-300">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-inner">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
        </svg>
      </div>
      <div class="flex items-center">
        <div>
          <h1 class="text-md font-bold tracking-wide">Live Web Editor <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded ml-2">Pro + Cloud</span></h1>
          <p class="text-[10px] text-gray-400">クラウド自動保存・認証対応版</p>
        </div>
        <div id="cloud-status" class="ml-4 text-xs font-semibold"></div>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <button onclick="handleLogout()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-900/40 hover:bg-red-800/80 border border-red-700/50 rounded text-xs text-red-200 transition duration-150" title="ログアウトします">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        ログアウト
      </button>

      <button onclick="toggleLayoutOrder()" class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-xs transition duration-150" title="エディタとプレビューの左右を入れ替えます">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
        </svg>
        左右入れ替え
      </button>

      <button onclick="resetLayout()" class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-xs transition duration-150" title="画面比率を50:50にリセットします">
        リセット
      </button>

      <button onclick="toggleHeader()" class="p-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-gray-400 hover:text-white" title="ヘッダーを隠して作業エリアを広げます">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11l7-7 7 7M5 19l7-7 7 7"></path>
        </svg>
      </button>
    </div>
  </header>

  <button id="restore-header-btn" onclick="toggleHeader()" class="hidden fixed top-2 right-4 z-50 p-1.5 bg-gray-800/80 backdrop-blur hover:bg-gray-700 border border-gray-700 rounded text-gray-400 hover:text-white shadow-lg transition duration-200">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 13l-7 7-7-7M19 5l-7 7-7-7"></path>
    </svg>
  </button>

  <div id="workspace" class="flex-grow flex h-full relative overflow-hidden">
    
    <div id="left-panel" class="h-full flex flex-col bg-gray-100 border-r border-gray-800 relative select-none" style="width: 50%;">
      <div class="bg-gray-800 text-gray-300 text-xs py-2 px-3 border-b border-gray-700 flex items-center justify-between shadow-sm z-10 select-none">
        <span class="font-semibold flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
          リアルタイムプレビュー
        </span>
        
        <div class="flex items-center bg-gray-900 rounded p-0.5 border border-gray-700">
          <button onclick="setPreviewSize('100%')" id="size-fluid" class="px-2.5 py-1 rounded bg-blue-600 text-white text-[10px] font-bold transition duration-150">
            全幅
          </button>
          <button onclick="setPreviewSize('768px')" id="size-tablet" class="px-2.5 py-1 rounded text-gray-400 hover:text-white text-[10px] font-bold transition duration-150">
            タブレット (768px)
          </button>
          <button onclick="setPreviewSize('375px')" id="size-mobile" class="px-2.5 py-1 rounded text-gray-400 hover:text-white text-[10px] font-bold transition duration-150">
            モバイル (375px)
          </button>
        </div>
      </div>
      
      <div class="flex-grow w-full bg-gray-200 flex justify-center items-center overflow-auto relative">
        <iframe id="preview" class="h-full w-full bg-white transition-all duration-200 border-l border-r border-gray-300 shadow-lg"></iframe>
      </div>
    </div>

    <div id="splitter" class="w-2.5 hover:w-2.5 bg-gray-800 hover:bg-blue-600 cursor-col-resize active:bg-blue-500 transition-colors duration-200 flex-shrink-0 z-30 flex items-center justify-center relative">
      <div class="h-8 w-[2px] bg-gray-600 rounded"></div>
    </div>

    <div id="right-panel" class="h-full flex flex-col bg-[#272822]" style="width: calc(50% - 10px);">
      <div class="flex bg-gray-950 overflow-x-auto border-b border-gray-800 custom-scrollbar flex-shrink-0" id="tabs">
      </div>
      
      <div class="flex-grow relative overflow-hidden">
        <textarea id="editor"></textarea>
      </div>
    </div>
    
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let files = {
      'index.html': {
        mode: 'htmlmixed',
        content: `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Preview</title>
  <!-- style.cssを読み込む -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="badge">☁️ Cloud Saved</div>
    <h1>クラウド対応 マルチビュー Web エディタ</h1>
    <p>コードを編集するとクラウドに自動保存されます。<br>再度開いたときに続きから作業が可能です！</p>
    
    <div class="features">
      <div class="feature-item">☁️ <strong>自動保存:</strong> 入力が止まると自動でクラウド同期</div>
      <div class="feature-item">🔒 <strong>セキュア:</strong> ログイン済みのユーザー専用データとして保存</div>
      <div class="feature-item">💻 <strong>レイアウト自由:</strong> スプリッターのドラッグや左右入れ替えが可能</div>
    </div>

    <button id="counter-btn">クリック回数: 0</button>
  </div>
  
  <!-- script.jsを読み込む -->
  <script src="script.js"><\/script>
</body>
</html>`
      },
      'style.css': {
        mode: 'css',
        content: `body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #dcfce7, #e0e7ff);
  color: #1e293b;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
}

.card {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
  max-width: 500px;
  width: 100%;
  text-align: center;
}

.badge {
  background-color: #10b981;
  color: white;
  font-size: 11px;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 9999px;
  display: inline-block;
  margin-bottom: 15px;
}

h1 {
  color: #1e1b4b;
  font-size: 24px;
  margin: 0 0 10px 0;
}

p {
  color: #4b5563;
  font-size: 14px;
  line-height: 1.6;
}

.features {
  text-align: left;
  background: rgba(243, 244, 246, 0.8);
  padding: 15px;
  border-radius: 10px;
  margin: 20px 0;
}

.feature-item {
  font-size: 13px;
  margin: 8px 0;
  color: #374151;
}

button {
  background: linear-gradient(to right, #10b981, #059669);
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  width: 100%;
  transition: all 0.2s;
  box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.4);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
}

button:active {
  transform: translateY(0);
}`
      },
      'script.js': {
        mode: 'javascript',
        content: `// クリックカウンターのロジック
let count = 0;
const button = document.getElementById('counter-btn');

if (button) {
  button.addEventListener('click', () => {
    count++;
    button.textContent = \`クリック回数: \${count}\`;
    
    if (count === 5) {
      button.style.background = 'linear-gradient(to right, #4f46e5, #7c3aed)';
      console.log('Nice clicking! Status Blue.');
    }
  });
}

console.log('スクリプトが初期化されました！');`
      }
    };

    let currentFile = 'index.html';
    let isLayoutSwapped = false;
    let currentUser = null;

    function showLoading(message) {
      document.getElementById('auth-overlay').style.display = 'flex';
      document.getElementById('auth-overlay').style.opacity = '1';
      document.getElementById('auth-loading').style.display = 'flex';
      document.getElementById('auth-form-container').style.display = 'none';
      if (message) document.getElementById('auth-message').textContent = message;
    }

    function showLoginForm(errorMessage = null) {
      document.getElementById('auth-overlay').style.display = 'flex';
      document.getElementById('auth-overlay').style.opacity = '1';
      document.getElementById('auth-loading').style.display = 'none';
      document.getElementById('auth-form-container').style.display = 'block';
      
      const errorEl = document.getElementById('auth-error');
      if (errorMessage) {
        errorEl.textContent = errorMessage;
        errorEl.style.display = 'block';
      } else {
        errorEl.style.display = 'none';
      }
    }

    function hideAuth() {
      document.getElementById('auth-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('auth-overlay').style.display = 'none', 300);
    }

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        showLoading('クラウドからデータを読み込んでいます...');
        await loadData();
        hideAuth();
      } else {
        currentUser = null;
        showLoginForm();
      }
    });

    showLoading('認証状態を確認しています...');

    window.handleLogin = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        showLoginForm('メールアドレスとパスワードを入力してください。');
        return;
      }
      
      showLoading('ログインしています...');
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error(error);
        let msg = 'ログインに失敗しました。';
        if (error.code === 'auth/invalid-credential') msg = 'メールアドレスまたはパスワードが間違っています。';
        showLoginForm(msg);
      }
    };

    window.handleSignUp = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        showLoginForm('メールアドレスとパスワードを入力してください。');
        return;
      }
      if (password.length < 6) {
        showLoginForm('パスワードは6文字以上で入力してください。');
        return;
      }
      
      showLoading('アカウントを作成しています...');
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error(error);
        let msg = 'アカウント作成に失敗しました。';
        if (error.code === 'auth/email-already-in-use') msg = 'このメールアドレスは既に登録されています。';
        showLoginForm(msg);
      }
    };

    window.handleLogout = async function() {
      if (confirm('ログアウトしますか？')) {
        await triggerSave(true);
        await signOut(auth);
      }
    };

    async function loadData() {
      if (!currentUser) return;
      try {
        const docRef = doc(db, 'users', currentUser.uid, 'projects', 'default');
        const snap = await getDoc(docRef);
        
        if (snap.exists() && snap.data().filesJson) {
          files = JSON.parse(snap.data().filesJson);
          if (!files[currentFile]) {
            currentFile = Object.keys(files)[0];
          }
        } else {
          await triggerSave(true);
        }
      } catch(e) {
        console.error("Load failed:", e);
      }
      
      editor.setValue(files[currentFile].content);
      renderTabs();
      updatePreview();
    }

    let saveTimeout;
    async function triggerSave(immediate = false) {
      if (!currentUser) return;
      
      const statusEl = document.getElementById('cloud-status');
      statusEl.innerHTML = '<span class="text-yellow-400">同期中...</span>';
      
      clearTimeout(saveTimeout);
      
      const saveAction = async () => {
        try {
          const docRef = doc(db, 'users', currentUser.uid, 'projects', 'default');
          await setDoc(docRef, { filesJson: JSON.stringify(files) });
          
          statusEl.innerHTML = '<span class="text-green-400">クラウドに保存しました</span>';
          setTimeout(() => {
            if (statusEl.innerText === 'クラウドに保存しました') {
              statusEl.innerHTML = '';
            }
          }, 3000);
        } catch (e) {
          console.error("Save failed:", e);
          statusEl.innerHTML = '<span class="text-red-400">保存エラー</span>';
        }
      };

      if (immediate) {
        await saveAction();
      } else {
        saveTimeout = setTimeout(saveAction, 1000);
      }
    }

    const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      lineNumbers: true,
      mode: 'htmlmixed',
      theme: 'monokai',
      autoCloseTags: true,
      autoCloseBrackets: true, 
      tabSize: 2,
      indentUnit: 2,
      lineWrapping: true
    });

    let previewTimeout;
    editor.on('change', () => {
      if (!files[currentFile]) return;
      const newVal = editor.getValue();
      
      if (files[currentFile].content !== newVal) {
        files[currentFile].content = newVal;
        
        clearTimeout(previewTimeout);
        previewTimeout = setTimeout(updatePreview, 400);
        
        triggerSave();
      }
    });

    const leftPanel = document.getElementById('left-panel');
    const rightPanel = document.getElementById('right-panel');
    const splitter = document.getElementById('splitter');
    const workspace = document.getElementById('workspace');
    const previewIframe = document.getElementById('preview');

    let isDragging = false;

    splitter.addEventListener('mousedown', (e) => {
      isDragging = true;
      document.body.classList.add('no-select');
      previewIframe.style.pointerEvents = 'none'; 
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const containerRect = workspace.getBoundingClientRect();
      const relativeX = e.clientX - containerRect.left;
      
      let percentage = (relativeX / containerRect.width) * 100;
      if (isLayoutSwapped) percentage = 100 - percentage;
      if (percentage < 15) percentage = 15;
      if (percentage > 85) percentage = 85;

      if (!isLayoutSwapped) {
        leftPanel.style.width = `calc(${percentage}% - 5px)`;
        rightPanel.style.width = `calc(${100 - percentage}% - 5px)`;
      } else {
        rightPanel.style.width = `calc(${percentage}% - 5px)`;
        leftPanel.style.width = `calc(${100 - percentage}% - 5px)`;
      }
      editor.refresh();
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.classList.remove('no-select');
        previewIframe.style.pointerEvents = 'auto';
        editor.refresh();
      }
    });

    window.setPreviewSize = function(width) {
      const activeClass = "bg-blue-600 text-white";
      const inactiveClass = "text-gray-400 hover:text-white";
      
      document.getElementById('size-fluid').className = `px-2.5 py-1 rounded text-[10px] font-bold transition duration-150 ${width === '100%' ? activeClass : inactiveClass}`;
      document.getElementById('size-tablet').className = `px-2.5 py-1 rounded text-[10px] font-bold transition duration-150 ${width === '768px' ? activeClass : inactiveClass}`;
      document.getElementById('size-mobile').className = `px-2.5 py-1 rounded text-[10px] font-bold transition duration-150 ${width === '375px' ? activeClass : inactiveClass}`;
      previewIframe.style.width = width;
    };

    window.toggleLayoutOrder = function() {
      isLayoutSwapped = !isLayoutSwapped;
      
      if (isLayoutSwapped) {
        workspace.style.flexDirection = 'row-reverse';
        leftPanel.classList.remove('border-r');
        leftPanel.classList.add('border-l');
      } else {
        workspace.style.flexDirection = 'row';
        leftPanel.classList.remove('border-l');
        leftPanel.classList.add('border-r');
      }
      editor.refresh();
    };

    window.resetLayout = function() {
      leftPanel.style.width = 'calc(50% - 5px)';
      rightPanel.style.width = 'calc(50% - 5px)';
      editor.refresh();
    };

    window.toggleHeader = function() {
      const header = document.getElementById('header');
      const restoreBtn = document.getElementById('restore-header-btn');
      
      if (header.classList.contains('hidden')) {
        header.classList.remove('hidden');
        restoreBtn.classList.add('hidden');
      } else {
        header.classList.add('hidden');
        restoreBtn.classList.remove('hidden');
      }
      setTimeout(() => editor.refresh(), 310);
    };

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';
      
      Object.keys(files).forEach(filename => {
        const tab = document.createElement('div');
        const isActive = filename === currentFile;
        
        tab.className = `px-4 py-2 cursor-pointer border-r border-gray-900 text-xs flex items-center gap-2 select-none transition-colors duration-150 ${isActive ? 'bg-[#272822] text-white border-t-2 border-t-blue-500 font-bold' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`;
        
        let iconHtml = '';
        if (filename.endsWith('.html')) iconHtml = '<span class="text-orange-500 font-extrabold">&lt;/&gt;</span>';
        else if (filename.endsWith('.css')) iconHtml = '<span class="text-blue-400 font-extrabold">#</span>';
        else if (filename.endsWith('.js')) iconHtml = '<span class="text-yellow-400 font-extrabold">JS</span>';

        tab.innerHTML = `${iconHtml} <span>${filename}</span>`;
        tab.onclick = () => switchTab(filename);
        tabsContainer.appendChild(tab);
      });
      
      const addBtn = document.createElement('div');
      addBtn.className = 'px-4 py-2 cursor-pointer text-xs bg-gray-900 text-gray-500 hover:bg-gray-800 hover:text-white flex items-center gap-1 font-bold select-none transition-colors duration-150';
      addBtn.innerHTML = '<span>+</span> <span>追加</span>';
      addBtn.onclick = addFile;
      tabsContainer.appendChild(addBtn);
    }

    function switchTab(filename) {
      if (currentFile === filename) return;
      currentFile = filename;
      editor.setOption('mode', files[filename].mode);
      editor.setValue(files[filename].content);
      renderTabs();
    }

    function addFile() {
      const filename = prompt("新しいファイル名を入力してください\n(例: custom.css, utils.js)");
      if (!filename) return;
      
      if (files[filename]) {
        alert("その名前のファイルはすでに存在します。");
        return;
      }
      
      let mode = 'javascript';
      if (filename.endsWith('.css')) mode = 'css';
      else if (filename.endsWith('.html')) mode = 'htmlmixed';
      else if (filename.endsWith('.js')) mode = 'javascript';
      
      files[filename] = { content: '', mode: mode };
      switchTab(filename);
      triggerSave();
    }

    function updatePreview() {
      if (!files['index.html']) return;
      
      let htmlContent = files['index.html'].content;

      htmlContent = htmlContent.replace(/<link\s+[^>]*href=["']([^"']+)["'][^>]*\/?>/gi, (match, filename) => {
        if (files[filename] && filename.endsWith('.css')) {
          return `<style>\n/* --- Loaded from ${filename} --- */\n${files[filename].content}\n</style>`;
        }
        return match;
      });

      htmlContent = htmlContent.replace(/<script\s+[^>]*src=["']([^"']+)["'][^>]*><\/script>/gi, (match, filename) => {
        if (files[filename] && filename.endsWith('.js')) {
          return `<script>\n/* --- Loaded from ${filename} --- */\n${files[filename].content}\n<\/script>`;
        }
        return match;
      });

      const iframe = document.getElementById('preview');
      iframe.srcdoc = htmlContent;
    }

    resetLayout();
  </script>
</body>
</html>
